name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      # The build regenerates src/mcp/skills.generated.ts; a diff means the committed
      # file is stale even though the drift test ran against the pre-build tree.
      - run: git diff --exit-code
